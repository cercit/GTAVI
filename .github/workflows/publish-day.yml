name: Publish today's product

# Times are UTC. IST = UTC + 5:30. Each run is 15 minutes early, as a buffer
# in case GitHub starts the job late.
#   12 Nov: 09:15 UTC = 2:45 pm IST (live by 3 pm, post at 4 pm)
#   13 Nov: 08:15 UTC = 1:45 pm IST (live by 2 pm, post at 3 pm)
#   14 Nov: 06:15 UTC = 11:45 am IST (live by 12 pm, post at 1 pm)
#   15-19 Nov: 09:15 UTC = 2:45 pm IST (change per day if the post time changes)
# Each day also has a backup run 30 minutes later, because GitHub sometimes
# skips scheduled runs (the 12 Nov run never started). If the day is already
# live, the backup run does nothing.
on:
  schedule:
    - cron: "15 9 12 11 *"
    - cron: "15 8 13 11 *"
    - cron: "45 8 13 11 *"
    - cron: "15 6 14 11 *"
    - cron: "45 6 14 11 *"
    - cron: "15 9 15-19 11 *"
    - cron: "45 9 15-19 11 *"
  workflow_dispatch:
    inputs:
      day:
        description: "Day number to publish (blank = work it out from today's date)"
        required: false
      dry_run:
        description: "Dry run only (show the changes, publish nothing)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the day
        run: |
          chmod +x tools/publish-day.sh
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            tools/publish-day.sh ${{ inputs.day }} --dry-run
            exit 0
          fi
          tools/publish-day.sh ${{ inputs.day }}
          if git diff --cached --quiet; then echo "Nothing to publish."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish today's product (scheduled)"
          git push

      - name: Ask GitHub Pages to rebuild
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request skipped"

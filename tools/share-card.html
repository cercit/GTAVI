<!doctype html>
<html lang="en" data-page="hub">
<head>
<!-- Template for the 1200x630 link-preview images. Not a page of the site.
     tools/make-share-cards.py opens it once per card and saves a picture of #card.
     ?n=1&art=assets/v-cover.jpg&pos=50%25+40%25   one day      ?hub=1&art=...   the hub -->
<base href="../">
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Share card template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700..900&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400..500&display=swap" rel="stylesheet">
<script src="days.js"></script>
<style>
  html, body { margin: 0; background: #09090b; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #09090b; color: #f5f2ed; font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
  .art { position: absolute; inset: 0 0 0 auto; width: 68%; background: #09090b center / cover no-repeat; }
  .panel { position: absolute; inset: 0 auto 0 0; width: 58%; background: #09090b; clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%); }
  .edge { position: absolute; inset: 0 auto 0 0; width: 58.5%; background: linear-gradient(180deg, #ffc46b, #ff8a5c 36%, #ff3f8e 70%, #b06bff); clip-path: polygon(99.2% 0, 100% 0, 80% 100%, 79.2% 100%); }
  .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(9,9,11,.55), rgba(9,9,11,0) 30%); }
  .in { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 54px 60px 46px; }
  .k { font: 600 17px "Inter", sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #d6d1ca; }
  .k b { color: #ff3f8e; font-weight: 700; }
  h1 { margin: auto 0 0; max-width: 490px; font-family: "Archivo", sans-serif; font-weight: 800; font-stretch: 75%; font-variation-settings: "wdth" 70; text-transform: uppercase; line-height: .9; letter-spacing: -.01em; }
  h1 span { background: linear-gradient(90deg, #ffc46b, #ff8a5c 36%, #ff3f8e 70%, #b06bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hook { max-width: 470px; margin: 20px 0 0; font: italic 400 31px/1.2 "Newsreader", Georgia, serif; }
  .by { margin-top: 30px; font: 700 17px "Inter", sans-serif; letter-spacing: .04em; }
  .by small { display: block; max-width: 440px; margin-top: 6px; font: 500 13.5px "Inter", sans-serif; letter-spacing: .01em; color: #a39d95; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="art" id="art"></div><div class="shade"></div><div class="panel"></div><div class="edge"></div>
  <div class="in">
    <div class="k" id="k"></div>
    <h1 id="t"></h1>
    <p class="hook" id="h"></p>
    <div class="by">By Sameer Mittimani · cercit.github.io/GTAVI<small>Independent product breakdown. Artwork © Rockstar Games / Take-Two Interactive.</small></div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
  const art = $("art"); art.style.backgroundImage = "url('" + (q.get("art") || "assets/h-rooftop.jpg") + "')"; art.style.backgroundPosition = q.get("pos") || "50% 50%";
  const size = s => (s.length <= 6 ? 168 : s.length <= 10 ? 136 : s.length <= 14 ? 120 : 92) + "px";
  if (q.get("hub")) {
    $("k").innerHTML = "<b>A PM breakdown</b> · 11–19 Nov 2026";
    $("t").innerHTML = "9 Rockstar <span>products</span>"; $("t").style.fontSize = "100px";
    $("h").textContent = "One a day until GTA VI, read the way a product manager would.";
  } else {
    const d = DAYS[(+q.get("n") || 1) - 1];
    $("k").innerHTML = "<b>Product " + pad(d.n) + " / 09</b> · " + d.date + " 2026";
    $("t").textContent = d.title; $("t").style.fontSize = size(d.title);
    $("h").textContent = d.hook;
  }
</script>
</body>
</html>
